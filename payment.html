<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Thanh toán</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f5f5;
}

.payment-box{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

</style>

</head>
<body>

<div class="container mt-5">

<h2 class="text-center mb-4">Thanh toán đơn hàng</h2>

<div class="row">

<!-- Thông tin khách hàng -->
<div class="col-md-7">

<div class="payment-box">

<h4>Thông tin khách hàng</h4>

<form>

<div class="mb-3">
<label class="form-label">Họ và tên</label>
<input type="text" class="form-control" placeholder="Nhập họ tên">
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" placeholder="Nhập email">
</div>

<div class="mb-3">
<label class="form-label">Số điện thoại</label>
<input type="text" class="form-control" placeholder="Nhập số điện thoại">
</div>

<div class="mb-3">
<label class="form-label">Địa chỉ giao hàng</label>
<textarea class="form-control" rows="3"></textarea>
</div>

<h5 class="mt-4">Phương thức thanh toán</h5>

<div class="form-check">
<input class="form-check-input" type="radio" name="payment">
<label class="form-check-label">
Thanh toán khi nhận hàng (COD)
</label>
</div>

<div class="form-check">
<input class="form-check-input" type="radio" name="payment">
<label class="form-check-label">
Chuyển khoản ngân hàng
</label>
</div>

<div class="form-check">
<input class="form-check-input" type="radio" name="payment">
<label class="form-check-label">
Ví điện tử (Momo / ZaloPay)
</label>
</div>

<button class="btn btn-primary mt-4 w-100">
Xác nhận thanh toán
</button>

</form>

</div>

</div>

<!-- Tóm tắt đơn hàng -->
<div class="col-md-5">

<div class="payment-box">

<h4>Đơn hàng của bạn</h4>

<hr>

<div class="d-flex justify-content-between">
<span>Sách Java Programming</span>
<span>150.000đ</span>
</div>

<div class="d-flex justify-content-between">
<span>Sách HTML & CSS</span>
<span>120.000đ</span>
</div>

<hr>

<div class="d-flex justify-content-between">
<strong>Tổng tiền</strong>
<strong class="text-danger">270.000đ</strong>
</div>

</div>

</div>

</div>

</div>

</body>
</html>
